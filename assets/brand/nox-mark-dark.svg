<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Símbolo oficial do Project Nox">
  <defs>
    <linearGradient id="noxGold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A741E" />
    </linearGradient>
    <linearGradient id="noxPurple-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B59AF5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    </defs>
  <rect width="256" height="256" rx="56" fill="#080A11" />
  <g transform="translate(128, 134)">
    
    <!-- Outer architectural halo -->
    <circle cx="0" cy="4" r="76" fill="none" stroke="url(#noxGold-dark)" stroke-width="1.4" opacity="0.45" />

    <!-- Zenith 4-point Nox Star -->
    <path d="M 0 -86 L 3.2 -75.2 L 14 -72 L 3.2 -68.8 L 0 -58 L -3.2 -68.8 L -14 -72 L -3.2 -75.2 Z"
          fill="url(#noxGold-dark)">
      <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Golden Omega Arch -->
    <path d="M -46 50 L -24 50 L -24 34 A 42 42 0 1 1 24 34 L 24 50 L 46 50"
          fill="none" stroke="url(#noxGold-dark)" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Purple Faceted Apex (Lambda) -->
    <path d="M 0 -38 L 35 48 L 18 48 L 0 2 L -18 48 L -35 48 Z"
          fill="url(#noxPurple-dark)" />
    <path d="M 0 -38 L 35 48 L 18 48 L 0 2 Z"
          fill="#FFFFFF" opacity="0.16" />
    
  </g>
</svg>
