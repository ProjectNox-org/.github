<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 96" width="840" height="96" role="img" aria-label="Princípios do Project Nox: Construir, Compartilhar, Evoluir">
  <defs>
    <linearGradient id="philLine-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0" />
      <stop offset="20%" stop-color="#E2E8F0" stop-opacity="1" />
      <stop offset="80%" stop-color="#E2E8F0" stop-opacity="1" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="0" y="1" width="840" height="1" fill="url(#philLine-light)" />
  <rect x="0" y="94" width="840" height="1" fill="url(#philLine-light)" />

  <!-- Column 1: Construir -->
  <g transform="translate(140, 0)" text-anchor="middle">
    <text x="0" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" letter-spacing="1.4" fill="#0F172A">CONSTRUIR</text>
    <text x="0" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Software sólido para uso real</text>
  </g>

  <circle cx="280" cy="48" r="2.2" fill="#A67C1E" opacity="0.75" />

  <!-- Column 2: Compartilhar -->
  <g transform="translate(420, 0)" text-anchor="middle">
    <text x="0" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" letter-spacing="1.4" fill="#6D28D9">COMPARTILHAR</text>
    <text x="0" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Código aberto e transparente</text>
  </g>

  <circle cx="560" cy="48" r="2.2" fill="#A67C1E" opacity="0.75" />

  <!-- Column 3: Evoluir -->
  <g transform="translate(700, 0)" text-anchor="middle">
    <text x="0" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" letter-spacing="1.4" fill="#0F172A">EVOLUIR</text>
    <text x="0" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Melhoria contínua com a comunidade</text>
  </g>
</svg>
