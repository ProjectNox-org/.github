<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Project Nox — Iniciativa independente de tecnologia e código aberto">
  <defs>
    
    <linearGradient id="noxGold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89B32" />
      <stop offset="50%" stop-color="#A67C1E" />
      <stop offset="100%" stop-color="#78550E" />
    </linearGradient>
    <linearGradient id="noxPurple-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    
    <linearGradient id="heroBg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFD" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <radialGradient id="glowP-light" cx="20%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowG-light" cx="85%" cy="20%" r="34%">
      <stop offset="0%" stop-color="#A67C1E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#A67C1E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ruleGrad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67C1E" />
      <stop offset="45%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-light" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.45" />
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#heroBg-light)" stroke="#E2E8F0" stroke-width="1.25" />
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#grid-light)" />
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#glowP-light)" />
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#glowG-light)" />

  <!-- Subtle animated orbital ring -->
  <g transform="translate(220, 154)">
    <circle cx="0" cy="4" r="90" fill="none" stroke="#6D28D9" stroke-width="0.9" stroke-dasharray="3 9" opacity="0.32">
      <animateTransform attributeName="transform" type="rotate" from="0 0 4" to="360 0 4" dur="60s" repeatCount="indefinite" />
    </circle>
    
    <!-- Outer architectural halo -->
    <circle cx="0" cy="4" r="76" fill="none" stroke="url(#noxGold-light)" stroke-width="1.4" opacity="0.45" />

    <!-- Zenith 4-point Nox Star -->
    <path d="M 0 -86 L 3.2 -75.2 L 14 -72 L 3.2 -68.8 L 0 -58 L -3.2 -68.8 L -14 -72 L -3.2 -75.2 Z"
          fill="url(#noxGold-light)">
      <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Golden Omega Arch -->
    <path d="M -46 50 L -24 50 L -24 34 A 42 42 0 1 1 24 34 L 24 50 L 46 50"
          fill="none" stroke="url(#noxGold-light)" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Purple Faceted Apex (Lambda) -->
    <path d="M 0 -38 L 35 48 L 18 48 L 0 2 L -18 48 L -35 48 Z"
          fill="url(#noxPurple-light)" />
    <path d="M 0 -38 L 35 48 L 18 48 L 0 2 Z"
          fill="#FFFFFF" opacity="0.16" />
    
  </g>

  <!-- Editorial Brand Lockup -->
  <g transform="translate(370, 0)">
    <text x="0" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.6" fill="#A67C1E">
      INICIATIVA INDEPENDENTE · CÓDIGO ABERTO
    </text>

    <text x="0" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="3">
      <tspan fill="#0F172A">PROJECT </tspan><tspan fill="#6D28D9">NOX</tspan>
    </text>

    <rect x="0" y="188" width="460" height="1.5" rx="1" fill="url(#ruleGrad-light)" />

    <text x="0" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#334155">
      Tecnologia, software e soluções digitais em evolução contínua.
    </text>
  </g>
</svg>
